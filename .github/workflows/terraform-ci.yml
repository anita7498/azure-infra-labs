name: Terraform CI

on:
  push:
    branches:
      - "feature/**"  # run on code pushed to any feature branch
  pull_request:
    branches:
      - main  # run on pull requests to the main branch

jobs:
  terraform-ci:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: infra

    steps:
      # Pull the repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install and configure the Terraform CLI on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Check Azure Account
        shell: powershell
        run: |
          az account show

      # Check .tf files are formatted correctly
      - name: Terraform Format Check
        run: terraform fmt -check
      
      # Show what Terraform directory the runner is actually using
      - name: Check Terraform Working Directory
        shell: powershell
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "`nTerraform files:"
          Get-ChildItem

          Write-Host "`nTerraform version:"
          terraform version
      
      - name: Check Terraform Environment
        shell: powershell
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "`nFiles:"
          Get-ChildItem -Force

          Write-Host "`nTerraform executable:"
          Get-Command terraform | Format-List Source

          Write-Host "`nTerraform path:"
          where.exe terraform

          Write-Host "`nTerraform version:"
          terraform version

      # Prepare Terraform working directory and download required providers/modules
      - name: Terraform Init
        run: terraform init

      # Check whether Terraform configuration is valid
      - name: Terraform Validate
        run: terraform validate
